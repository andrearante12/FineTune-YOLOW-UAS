# INT8 calibration set for scripts/benchmark_thor.py. ultralytics calibrates on the
# "val" split of the data yaml, so point it at VisDrone *train* images to keep the
# calibration set disjoint from the val images the accuracy check scores.
# Use with --calib-fraction 0.08 (~520 images).
path: datasets/VisDrone
train: images/train
val: images/train

names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
